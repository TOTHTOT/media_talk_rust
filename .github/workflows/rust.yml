name: Rust CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  RUSTFLAGS: -D warnings
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy (sw-decode)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux system deps (ALSA + GStreamer dev)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/*
      - run: cargo clippy --workspace --all-targets --features sw-decode -- -D warnings

  test:
    name: test (sw-decode)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux system deps (ALSA + GStreamer dev)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/*
      - run: cargo test --workspace --features sw-decode

  cross-check:
    name: build (no default features, no hw-decode)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux system deps (ALSA + GStreamer dev)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/*
      - run: cargo build --workspace --no-default-features --locked

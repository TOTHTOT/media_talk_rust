[package]
name = "media_talk_rust"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "media talk server binary (discover + serve)"

[[bin]]
name = "media_talk_rust"
path = "src/main.rs"

[dependencies]
ipcam-core = { path = "../ipcam-core" }
ipcam-discovery = { path = "../ipcam-discovery" }
hardware-decode = { path = "../hardware-decode" }
web-display = { path = "../web-display" }
ipcam-alsa = { path = "../ipcam-alsa" }
v4l2-device-cap = { path = "../v4l2-device-cap" }
# GStreamer-based ingest (unconditional); requires GStreamer + pkg-config
# on the build host.
ipcam-gst = { path = "../ipcam-gst" }
# Slint 通话 GUI (gui 子命令)
call-ui = { path = "../call-ui" }

tokio = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
bytes = { workspace = true }
uuid = { workspace = true }
local-ip-address = { workspace = true }
tokio-util = { workspace = true }

[features]
default = ["sw-decode"]
sw-decode = []
hw-decode = []
# 板子 (Armbian 无桌面) KMS 直显: cargo build -p media_talk_rust --features kms
kms = ["call-ui/kms"]

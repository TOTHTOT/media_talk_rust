[package]
name = "call-ui"
version = "0.2.0"
edition.workspace = true
license.workspace = true

[dependencies]
slint = { version = "=1.19.0", default-features = false, features = [
    "std",
    "backend-winit",
    "renderer-femtovg",
    # slint 1.17 要求显式开 compat-1-2 (default-features=false 时被关掉)
    "compat-1-2",
] }
# SVG 图标渲染 (lucide 图标): slint 顶层 crate 不导出 svg 开关, 直接钉
# 内部 crate 的 feature 靠 cargo feature 统一生效; 版本必须等于 slint
# 锁定的内部版本 (slint 对内部 crate 是 = 钉版)
i-slint-core = { version = "=1.19.0", features = ["svg"] }
# 统一组件库: 与 slint 1.19.0 配套, pre-1.0 必须精确锁版本
slint-kit = "=0.9.0"
tokio = { workspace = true, features = ["full"] }
tokio-util = { workspace = true }
thiserror = { workspace = true }
rsipstack = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
ipcam-core = { path = "../ipcam-core" }
ipcam-discovery = { path = "../ipcam-discovery" }
ipcam-gst = { path = "../ipcam-gst" }
ipcam-ice = { path = "../ipcam-ice", features = ["signal"] }
ipcam-sip = { path = "../ipcam-sip" }
parking_lot = { workspace = true }
rusqlite = { workspace = true }
directories = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[build-dependencies]
# 与 slint / slint-kit 编译器和运行时保持同一补丁版本
slint-build = "=1.19.0"
slint-kit-build = "=0.9.0"

[features]
# 板子 (Armbian 无桌面) 用 KMS 直显: 编译时 --features kms,
# 运行时 SLINT_BACKEND=linuxkms-* 选择渲染器. 需要系统包
# libgbm-dev libxkbcommon-dev libudev-dev libinput-dev
# (不用 libseat: focal 没有 libseat-dev, noseat 后端进程需拿 DRM master,
# 板上 root 部署天然满足)
kms = ["slint/backend-linuxkms-noseat", "slint/renderer-software"]

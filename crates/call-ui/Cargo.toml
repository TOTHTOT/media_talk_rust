[package]
name = "call-ui"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
slint = { version = "1", default-features = false, features = [
    "std",
    "backend-winit",
    "renderer-femtovg",
    # slint 1.17 要求显式开 compat-1-2 (default-features=false 时被关掉)
    "compat-1-2",
] }
# SVG 图标渲染 (lucide 图标): slint 顶层 crate 不导出 svg 开关, 直接钉
# 内部 crate 的 feature 靠 cargo feature 统一生效; 版本必须等于 slint
# 锁定的内部版本 (slint 对内部 crate 是 = 钉版)
i-slint-core = { version = "=1.18.1", features = ["svg"] }
tokio = { workspace = true, features = ["full"] }
tokio-util = { workspace = true }
rsipstack = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
ipcam-core = { path = "../ipcam-core" }
ipcam-discovery = { path = "../ipcam-discovery" }
ipcam-gst = { path = "../ipcam-gst" }
ipcam-sip = { path = "../ipcam-sip" }
parking_lot = { workspace = true }
rusqlite = { workspace = true }
directories = { workspace = true }

[build-dependencies]
slint-build = "1"
# build.rs 解压 material 组件集 zip (纯 Rust, 不依赖系统 tar)
zip = { version = "2", default-features = false, features = ["deflate"] }

[features]
# 板子 (Armbian 无桌面) 用 KMS 直显: 编译时 --features kms,
# 运行时 SLINT_BACKEND=linuxkms-* 选择渲染器. 需要系统包
# libgbm-dev libxkbcommon-dev libudev-dev libinput-dev
# (不用 libseat: focal 没有 libseat-dev, noseat 后端进程需拿 DRM master,
# 板上 root 部署天然满足)
kms = ["slint/backend-linuxkms-noseat", "slint/renderer-software"]

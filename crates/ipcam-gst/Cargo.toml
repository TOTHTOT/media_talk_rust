[package]
name = "ipcam-gst"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "GStreamer-based RTSP A/V ingest engine (replaces ipcam-rtsp play_loop)"

[dependencies]
ipcam-core = { path = "../ipcam-core" }
ipcam-ice = { path = "../ipcam-ice" }

bytes = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }
thiserror = { workspace = true }

# Real GStreamer bindings (unconditional). Requires GStreamer + pkg-config
# on the build host (the target board / Linux dev boxes / a Windows dev box
# with the GStreamer MSVC SDK on PATH).
gstreamer = { workspace = true }
gstreamer-app = { workspace = true }
gstreamer-video = { workspace = true }
# udpsrc/udpsink 的 "socket" 属性类型 (GSocket): 对称 RTP 共享 socket 用
gio = { workspace = true }
# ICE 控制面: watch 状态订阅 + oneshot marshal (public API 依赖, 非仅测试)
tokio = { workspace = true }

[dev-dependencies]
tracing-subscriber = { workspace = true }

[package]
name = "ipcam-gst"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "GStreamer-based RTSP A/V ingest engine (replaces ipcam-rtsp play_loop)"

[dependencies]
ipcam-core = { path = "../ipcam-core" }

bytes = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }
thiserror = { workspace = true }

# Real GStreamer bindings (unconditional). Requires GStreamer + pkg-config
# on the build host (the target board / Linux dev boxes / a Windows dev box
# with the GStreamer MSVC SDK on PATH).
gstreamer = "0.25.3"
gstreamer-app = "0.25.2"

[dev-dependencies]
tracing-subscriber = { workspace = true }

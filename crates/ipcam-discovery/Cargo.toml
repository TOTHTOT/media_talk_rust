[package]
name = "ipcam-discovery"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "ONVIF WS-Discovery + Device Management client (delegates to oxvif 0.12.0)"

[dependencies]
ipcam-core = { path = "../ipcam-core" }

tokio = { workspace = true }
reqwest = { workspace = true }
quick-xml = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
bytes = { workspace = true }
sha-1 = { workspace = true }
base64 = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
futures-util = { workspace = true }
async-trait = { workspace = true }
if-addrs = { workspace = true }
rand = { workspace = true }

# ONVIF client implementation — version pin lives in workspace Cargo.toml.
oxvif = { workspace = true }

[dev-dependencies]
# mirror of the main oxvif dep so `cargo test -p ipcam-discovery`
# builds + resolves the dependency graph without warnings
oxvif = { workspace = true }

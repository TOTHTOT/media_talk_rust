[package]
name = "ipcam-ice"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "libnice ICE agent 安全封装 (控制面 + 数据面, 独立于 gstreamer 媒体栈)"

[dependencies]
glib = { workspace = true }
gio = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
anyhow = {workspace = true}
# signal feature: sigserver WS 客户端
futures-util = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tokio-tungstenite = { workspace = true, optional = true }

[features]
default = []
signal = [
    "dep:futures-util",
    "dep:serde",
    "dep:serde_json",
    "dep:tokio-tungstenite",
]

[dev-dependencies]
# examples/ice_probe.rs 专用 (正式依赖保持轻: glib+gio+tokio+tracing;
# signal feature 打开时额外带 WS 客户端依赖)
clap = { workspace = true }
tracing-subscriber = { workspace = true }

[[example]]
name = "ice_probe"
required-features = ["signal"]

[workspace]
resolver = "2"
members = [
    "crates/media_talk_rust",
    "crates/ipcam-core",
    "crates/ipcam-discovery",
    "crates/hardware-decode",
    "crates/web-display",
    "crates/ipcam-alsa",
    "crates/v4l2-device-cap",
    "crates/ipcam-gst",
    "crates/ipcam-sip",
]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
tokio = { version = "1.53", features = ["full"] }
axum = { version = "0.8.9", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.7.0", features = ["trace", "fs"] }
tokio-tungstenite = "0.30.0"
futures-util = "0.3"
async-trait = "0.1.92"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls"] }
quick-xml = "0.41.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
bytes = "1.7"
thiserror = "2.0.20"
anyhow = "1.0"
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
dashmap = "6.1"
pin-project-lite = "0.2"
clap = { version = "4.5", features = ["derive"] }
sha-1 = "0.10"
base64 = "0.23.1"
nix = { version = "0.31.3", features = ["ioctl", "fs"] }
local-ip-address = "0.6"
alsa = "0.9"
bindgen = "0.69"
if-addrs = "0.10"
rand = "0.8"
# ONVIF client — strict-pinned: single-maintainer 0.x crate, churn is high;
# any 0.16+ upgrade is a new change.
oxvif = { version = "=0.15.0", default-features = false, features = ["mock"] }
gstreamer = "0.25.3"
gstreamer-app = "0.25.2"
gstreamer-video = "0.25.3"
rsipstack = "0.6.10"
sdp-rs = "0.2.1"
vec1 = "1"
tokio-util = { version = "0.7", features = ["rt"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true

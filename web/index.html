<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>media_talk 控制台</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; margin: 0; padding: 24px; background: #0f1419; color: #e6edf3; }
  h1 { font-size: 18px; }
  .grid { display: grid; grid-template-columns: 320px 1fr; gap: 16px; height: calc(100vh - 80px); }
  .panel { background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 12px; overflow: auto; }
  .device { padding: 8px; margin: 4px 0; border: 1px solid #30363d; border-radius: 4px; cursor: pointer; }
  .device:hover { background: #1f2937; }
  .device.active { background: #1e3a8a; }
  .device .profile { font-size: 12px; color: #8b949e; }
  video { width: 100%; height: 100%; background: #000; border-radius: 6px; }
  .empty { color: #8b949e; padding: 24px; text-align: center; }
</style>
</head>
<body>
<h1>media_talk 控制台</h1>
<div class="grid">
  <div class="panel" id="device-list">
    <div class="empty">加载中…</div>
  </div>
  <div class="panel" id="player-panel">
    <video id="player" controls autoplay muted></video>
  </div>
</div>
<script src="/play.js"></script>
</body>
</html>
